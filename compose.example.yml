name: paseo-relay

services:
  relay:
    image: ${PASEO_RELAY_IMAGE:-ghcr.io/meixg/paseo-relay:latest}
    restart: unless-stopped
    environment:
      PASEO_RELAY_HOST: "0.0.0.0"
      PASEO_RELAY_PORT: "4000"
      PASEO_RELAY_MIN_CLUSTER_SIZE: "1"
      PASEO_RELAY_OWNERSHIP_TARGET: local
    ports:
      - "127.0.0.1:4000:4000"
